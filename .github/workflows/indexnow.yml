# Avisa a los buscadores de que la web ha cambiado (IndexNow: Bing —del que tira la búsqueda de
# ChatGPT y Copilot—, Yandex, Seznam, Naver…). Se ejecuta solo cada vez que se publica en main,
# y también se puede lanzar a mano desde la pestaña Actions de GitHub.
# Google no usa IndexNow: para Google, Search Console.
name: Avisar a los buscadores (IndexNow)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    env:
      SITE: https://manelvila.com
      HOST: manelvila.com
      KEY: 5c9588674bb110511b98c213eae2f6d0   # pública a propósito: está publicada en la raíz de la web
    steps:
      - uses: actions/checkout@v4

      - name: Esperar a que Cloudflare publique esta versión
        run: |
          # La versión está en línea cuando manelvila.com sirve la misma huella (version.txt) que este commit
          want=$(cat version.txt)
          for i in $(seq 1 40); do
            live=$(curl -fsS "$SITE/version.txt?v=$GITHUB_SHA" 2>/dev/null || true)
            if [ "$live" = "$want" ] && curl -fsS "$SITE/$KEY.txt" 2>/dev/null | grep -q "$KEY"; then echo "Versión $want publicada en $SITE"; break; fi
            [ "$i" = 40 ] && { echo "::error::$SITE no sirve todavía la versión $want (sirve: $live)"; exit 1; }
            sleep 15
          done
          # Etiquetas de verificación de propiedad visibles en la home publicada
          curl -fsS "$SITE/" | grep -o '<meta name="\(msvalidate.01\|google-site-verification\)" content="[^"]*">' || echo "Sin etiquetas de verificación en la home"

      - name: Enviar todas las direcciones del sitemap
        run: |
          curl -fsS "$SITE/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed -e 's#<loc>##' -e 's#</loc>##' > urls.txt
          printf '%s\n' "$SITE/llms.txt" "$SITE/llms-full.txt" >> urls.txt
          echo "$(wc -l < urls.txt) direcciones"
          jq -n --arg host "$HOST" --arg key "$KEY" --arg loc "$SITE/$KEY.txt" --rawfile urls urls.txt \
            '{host: $host, key: $key, keyLocation: $loc, urlList: ($urls | split("\n") | map(select(length > 0)))}' > body.json
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' --data @body.json)
          echo "IndexNow respondió $code"; cat resp.txt || true
          case "$code" in 200|202) echo "Aviso enviado";; *) echo "::error::IndexNow respondió $code"; exit 1;; esac
